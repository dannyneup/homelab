services:
  mongo:
    image: mongo:latest
    labels:
      komodo.skip:
    command: --quiet --wiredTigerCacheSizeGB 0.25
    restart: unless-stopped
    logging:
      driver: ${COMPOSE_LOGGING_DRIVER:-local}
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - komodo-database

  core:
    image: ghcr.io/moghtech/komodo-core:latest
    labels:
      komodo.skip:
      traefik.enable: true
      traefik.http.routers.komodo.rule: Host(`komodo.neukoch.com`)
      traefik.http.services.komodo.loadbalancer.server.port: 9120
    restart: unless-stopped
    environment:
      KOMODO_DATABASE_ADDRESS: mongo:27017
      KOMODO_DATABASE_USERNAME: ${DB_USERNAME}
      KOMODO_DATABASE_PASSWORD: ${DB_PASSWORD}
      KOMODO_HOST: https://komodo.neukoch.com
      KOMODO_PASSKEY: ${PASSKEY}
    volumes:
      - repo-cache:/repo-cache:rw
      - syncs:/syncs:rw
    networks:
      - komodo-database
      - komodo-periphery
      - proxy

  periphery:
    image: ghcr.io/moghtech/komodo-periphery:latest
    labels:
      komodo.skip:
    restart: unless-stopped
    environment:
      KOMODO_PASSKEYS: ${PASSKEY}
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/proc:ro
      - /etc/komodo:/etc/komodo:rw
    networks:
      - komodo-periphery

volumes:
  mongo-data:
  mongo-config:
  repo-cache:
  syncs:

networks:
  komodo-periphery:
  komodo-database:
  proxy:
    external: true